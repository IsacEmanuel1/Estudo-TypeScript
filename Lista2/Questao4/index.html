<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Peso ideal</title>
</head>
<body>
    <h1>Calcular Peso</h1>

    <label for="sexo">Sexo:</label>
    <select id="sexo">
        <option value="" disabled selected>Selecione o seu Sexo</option>
        <option value="M">Masculino</option>
        <option value="F">Feminino</option>
    </select>

    <label for="altura">Sua altura em CM</label>
    <input id="altura" placeholder="exemplo: 1,70m = 170 cm">

    <button id="buttCalcular">Calcular Peso ideal</button>

    <p id="resultado"></p>

    <script type="module" src="./script.js"></script>
</body>
</html>
